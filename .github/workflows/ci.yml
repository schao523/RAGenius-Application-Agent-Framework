name: CI

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r ragenius_app_skeleton/backend/requirements.txt
          python -m pip install -r ragenius_builder/requirements.txt
      - name: Test RAG subsystem
        run: python -m pytest tests/test_rag_subsystem.py tests/test_local_database_bootstrap.py
      - name: Test app backend
        run: python -m pytest --basetemp="$env:RUNNER_TEMP/ragenius-app-backend" ragenius_app_skeleton/backend/tests
      - name: Test Builder
        shell: pwsh
        run: |
          $tests = Get-ChildItem ragenius_builder/flask_scaffold/tests -File -Filter "test_*.py" | ForEach-Object FullName
          python -m pytest --basetemp="$env:RUNNER_TEMP/ragenius-builder" @tests

  app-frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ragenius_app_skeleton/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ragenius_app_skeleton/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  execution-subsystem:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ragenius_execution_subsystem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ragenius_execution_subsystem/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
