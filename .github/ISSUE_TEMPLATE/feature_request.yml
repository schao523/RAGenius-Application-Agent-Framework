name: Feature request
description: Propose a scoped RAGenius improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the user or administrator problem without prescribing implementation.
    validations:
      required: true
  - type: dropdown
    id: subsystem
    attributes:
      label: Primary subsystem
      options:
        - rag_subsystem
        - ragenius_app_skeleton
        - ragenius_builder
        - ragenius_execution_subsystem
        - cross-subsystem
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Boundary and security considerations
      description: Note isolation, authorization, provider, migration, and compatibility concerns.
