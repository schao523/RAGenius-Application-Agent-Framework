<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen py-8">
  <div class="container mx-auto px-4">
    <h1 id="pageTitle" class="text-2xl font-bold mb-6">New Application</h1>
    <form id="appForm" class="bg-white p-6 rounded shadow mb-8">
      <div class="mb-4">
        <label for="name" class="block text-gray-700 mb-1">Name</label>
        <input type="text" id="name" name="name" class="w-full border rounded px-3 py-2" required>
      </div>
      <div class="mb-4">
        <label for="description" class="block text-gray-700 mb-1">Description</label>
        <textarea id="description" name="description" class="w-full border rounded px-3 py-2" rows="3" required></textarea>
      </div>
      <div class="mb-4">
        <label class="block text-gray-700 mb-1">Starter Questions (4)</label>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
          <input type="text" id="sq1" class="border rounded px-3 py-2" placeholder="Question 1" required>
          <input type="text" id="sq2" class="border rounded px-3 py-2" placeholder="Question 2" required>
          <input type="text" id="sq3" class="border rounded px-3 py-2" placeholder="Question 3" required>
          <input type="text" id="sq4" class="border rounded px-3 py-2" placeholder="Question 4" required>
        </div>
      </div>
      <div class="flex justify-end">
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Save Application</button>
      </div>
    </form>
    <!-- Tabs for instructions and settings -->
    <div id="tabs" class="bg-white p-6 rounded shadow hidden">
      <div class="mb-4 border-b border-gray-200">
        <nav class="-mb-px flex" aria-label="Tabs">
          <button id="tabInstructions" class="mr-4 py-2 px-3 text-sm font-medium text-blue-700 border-b-2 border-blue-700" onclick="switchTab('instructions')">Instructions</button>
          <button id="tabSettings" class="py-2 px-3 text-sm font-medium text-gray-500 border-b-2 border-transparent hover:text-gray-700" onclick="switchTab('settings')">Settings</button>
        </nav>
      </div>
      <!-- Instructions panel -->
      <div id="panelInstructions" class="">
        <textarea id="instructionsContent" class="w-full border rounded px-3 py-2 mb-4" rows="8" placeholder="Write markdown instructions here..."></textarea>
        <div class="flex justify-end">
          <button onclick="saveInstructions()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Save Instructions</button>
        </div>
        <h3 class="mt-4 mb-2 text-lg font-semibold">Preview</h3>
        <div id="instructionsPreview" class="prose border p-4 bg-gray-100 rounded overflow-auto"></div>
      </div>
      <!-- Settings panel -->
      <div id="panelSettings" class="hidden">
        <label for="settingsJson" class="block text-gray-700 mb-1">Configuration Settings (JSON)</label>
        <textarea id="settingsJson" class="w-full border rounded px-3 py-2 mb-4" rows="8" placeholder="{\n  \"param\": \"value\"\n}"></textarea>
        <div class="flex justify-end">
          <button onclick="saveSettings()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Save Settings</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const appId = params.get('app_id');
    const tabs = document.getElementById('tabs');
    const appForm = document.getElementById('appForm');
    const pageTitle = document.getElementById('pageTitle');

    // Switch tabs between instructions and settings
    function switchTab(name) {
      document.getElementById('panelInstructions').classList.toggle('hidden', name !== 'instructions');
      document.getElementById('panelSettings').classList.toggle('hidden', name !== 'settings');
      document.getElementById('tabInstructions').classList.toggle('border-blue-700', name === 'instructions');
      document.getElementById('tabInstructions').classList.toggle('text-blue-700', name === 'instructions');
      document.getElementById('tabSettings').classList.toggle('border-blue-700', name === 'settings');
      document.getElementById('tabSettings').classList.toggle('text-blue-700', name === 'settings');
    }

    // Update preview when instructions content changes
    const instructionsContent = document.getElementById('instructionsContent');
    const instructionsPreview = document.getElementById('instructionsPreview');
    instructionsContent.addEventListener('input', () => {
      instructionsPreview.textContent = instructionsContent.value;
    });

    // Load app if editing
    async function loadApp() {
      if (!appId) return;
      pageTitle.textContent = 'Edit Application';
      const resp = await fetch(`/api/apps/${appId}`);
      if (!resp.ok) {
        alert('Failed to load application');
        return;
      }
      const app = await resp.json();
      document.getElementById('name').value = app.name;
      document.getElementById('description').value = app.description;
      document.getElementById('sq1').value = app.starter_questions[0] || '';
      document.getElementById('sq2').value = app.starter_questions[1] || '';
      document.getElementById('sq3').value = app.starter_questions[2] || '';
      document.getElementById('sq4').value = app.starter_questions[3] || '';
      // Show tabs for existing app
      tabs.classList.remove('hidden');
      // Fetch instructions
      const instResp = await fetch(`/api/apps/${appId}/instructions`);
      if (instResp.ok) {
        const text = await instResp.text();
        instructionsContent.value = text;
        instructionsPreview.textContent = text;
      }
      // Fetch settings
      const setResp = await fetch(`/api/apps/${appId}/settings`);
      if (setResp.ok) {
        const json = await setResp.json();
        document.getElementById('settingsJson').value = JSON.stringify(json.settings, null, 2);
      }
    }

    // Create or update app
    appForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        name: document.getElementById('name').value.trim(),
        description: document.getElementById('description').value.trim(),
        starter_questions: [
          document.getElementById('sq1').value.trim(),
          document.getElementById('sq2').value.trim(),
          document.getElementById('sq3').value.trim(),
          document.getElementById('sq4').value.trim(),
        ]
      };
      try {
        let resp;
        if (appId) {
          resp = await fetch(`/api/apps/${appId}`, {method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
        } else {
          body.config_schema = {};
          body.config_settings = {};
          resp = await fetch('/api/apps', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
        }
        if (!resp.ok) {
          const err = await resp.json();
          alert(err.detail || 'Error');
        } else {
          const resData = await resp.json();
          // Redirect to edit page after creation
          window.location.href = `app_form.html?app_id=${resData.id}`;
        }
      } catch (err) {
        console.error(err);
        alert('Failed to save application');
      }
    });

    async function saveInstructions() {
      if (!appId) return;
      const resp = await fetch(`/api/apps/${appId}/instructions`, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({content: instructionsContent.value})
      });
      if (!resp.ok) {
        const err = await resp.json();
        alert(err.detail || 'Failed to save instructions');
      } else {
        alert('Instructions saved');
      }
    }

    async function saveSettings() {
      if (!appId) return;
      let settings;
      try {
        settings = JSON.parse(document.getElementById('settingsJson').value || '{}');
      } catch (err) {
        alert('Invalid JSON in settings');
        return;
      }
      const resp = await fetch(`/api/apps/${appId}/settings`, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({settings})
      });
      if (!resp.ok) {
        const err = await resp.json();
        alert(err.detail || 'Failed to save settings');
      } else {
        alert('Settings saved');
      }
    }

    // Initialize page
    if (appId) {
      loadApp();
    }
  </script>
</body>
</html>
