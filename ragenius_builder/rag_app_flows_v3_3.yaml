##
# Workflow execution mapping for version 3.3 of the RAG application flows.
#
# This YAML document defines the high‑level states and transitions used by
# the platform to orchestrate application lookup, creation and instruction
# updates.  Only the states relevant to the v3.3 delta are shown here; they
# demonstrate how to bind database queries and file writes into the
# orchestrated flows.  Additional states (e.g. configuration settings
# validation or document ingestion) would be defined analogously.

id: rag_app_flows_v3_3
version: "3.3"
states:
  # Resolve an application by its name (case‑insensitive).  External
  # integrators call this flow to convert a user‑provided name into an
  # application identifier and metadata.  If the application does not
  # exist the workflow terminates with a not_found outcome.
  - id: app_lookup_by_name
    type: task
    action:
      type: db_query
      # The query uses a named parameter :name which must be provided by
      # the caller.  The database implementation is responsible for
      # performing the case‑folding and returning at most one row.
      query: |
        SELECT id, name, description, starter_questions, instructions_uri,
               instructions_version, instructions_updated_at,
               config_settings, config_schema
        FROM applications
        WHERE lower(name) = lower(:name)
    on:
      not_found: app_lookup_failed
      success: return_app

  # If no application matches the provided name this state ends the flow.
  - id: app_lookup_failed
    type: end
    outcome: not_found

  # Return the application record to the caller.
  - id: return_app
    type: end
    outcome: success

  # Persist new or updated instructions to the file system.  The
  # path_ref specifies where on disk to write the markdown content.  The
  # content_ref should be a runtime field pointing at the new markdown
  # text supplied by the caller.
  - id: write_instructions_file
    type: task
    action:
      type: file_write
      path_ref: "instructions/{app_id}/instructions.md"
      content_ref: new_instructions
    on:
      success: update_instructions_db
      failure: instructions_write_failed

  # Update the application record to point at the new instructions file,
  # increment the version and set the updated timestamp.  The DB update
  # semantics (e.g. parameter binding) are left to the implementation.
  - id: update_instructions_db
    type: task
    action:
      type: db_update
      table: applications
      where: id = :app_id
      set:
        instructions_uri: "instructions/{app_id}/instructions.md"
        instructions_version: "instructions_version + 1"
        instructions_updated_at: "NOW()"
    on:
      success: instructions_update_complete
      failure: instructions_db_update_failed

  # Successful completion of instructions.update_v1 flow.
  - id: instructions_update_complete
    type: end
    outcome: success

  # Failure handlers for the instructions update flow.
  - id: instructions_write_failed
    type: end
    outcome: file_write_error
  - id: instructions_db_update_failed
    type: end
    outcome: db_update_error