<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title or 'RAGenius Builder' }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    :focus { outline: 3px solid #2563eb; outline-offset: 2px; }
  </style>
</head>
<body class="min-h-full text-gray-900">
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 bg-white text-blue-700 px-3 py-2 rounded shadow">Skip to content</a>
  <header class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="inline-flex h-10 w-10 items-center justify-center rounded-lg bg-blue-600 text-white font-bold">R</span>
        <div>
          <p class="text-lg font-semibold">RAGenius Builder</p>
          <p class="text-sm text-gray-600">Accessible, WCAG AA compliant</p>
        </div>
      </div>
      <nav aria-label="Primary" class="flex items-center gap-4 text-sm">
        <a href="{{ url_for('apps') }}" class="text-gray-700 hover:text-blue-700 font-semibold">Applications</a>
        <a href="{{ url_for('skills') }}" class="text-gray-700 hover:text-blue-700 font-semibold">Skills</a>
        <a href="{{ url_for('agent_skills') }}" class="text-gray-700 hover:text-blue-700 font-semibold">Agent Skills</a>
        <a href="{{ url_for('subsystem_settings') }}" class="text-gray-700 hover:text-blue-700 font-semibold">Subsystem</a>
        <a href="{{ url_for('new_app') }}" class="inline-flex items-center gap-2 px-3 py-2 rounded bg-blue-600 text-white hover:bg-blue-700">New App</a>
      </nav>
    </div>
  </header>
  <div id="main" class="max-w-6xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
