<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Documents</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen py-8">
  <div class="container mx-auto px-4">
    <h1 class="text-2xl font-bold mb-6">Upload Documents</h1>
    <div class="mb-4">
      <input type="file" id="fileInput" multiple class="border p-2 rounded w-full" />
    </div>
    <div class="mb-4">
      <button onclick="uploadFiles()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Upload</button>
    </div>
    <ul id="fileList" class="space-y-2"></ul>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const appId = params.get('app_id');
    if (!appId) {
      alert('Missing app_id');
    }
    function listFiles() {
      const input = document.getElementById('fileInput');
      const list = document.getElementById('fileList');
      list.innerHTML = '';
      Array.from(input.files).forEach(file => {
        const li = document.createElement('li');
        li.className = 'p-2 bg-white rounded shadow flex justify-between items-center';
        li.textContent = `${file.name} (${(file.size/1024).toFixed(1)} KB)`;
        list.appendChild(li);
      });
    }
    document.getElementById('fileInput').addEventListener('change', listFiles);
    async function uploadFiles() {
      const files = document.getElementById('fileInput').files;
      if (!files.length) {
        alert('Please choose files to upload');
        return;
      }
      const formData = new FormData();
      Array.from(files).forEach(file => formData.append('files', file));
      try {
        const resp = await fetch(`/api/apps/${appId}/uploads`, {
          method: 'POST',
          body: formData
        });
        if (!resp.ok) {
          const err = await resp.json();
          alert(err.detail || 'Upload failed');
        } else {
          const resData = await resp.json();
          alert(`Uploaded ${resData.uploaded.length} documents`);
          listFiles();
        }
      } catch (err) {
        console.error(err);
        alert('Error uploading files');
      }
    }
  </script>
</body>
</html>
