[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-subsystem"
version = "0.1.0"
description = "Deterministic Python RAG subsystem with ingestion and retrieval pipelines"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "schao523"}]
license = {text = "MIT"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
pgvector = ["pg8000>=1.31,<2"]
local-embeddings = [
  "sentence-transformers>=2.7",
  "torch>=2.2",
]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/schao523/RAGenius-Application-Agent-Framework"
Repository = "https://github.com/schao523/RAGenius-Application-Agent-Framework"
Issues = "https://github.com/schao523/RAGenius-Application-Agent-Framework/issues"

[tool.setuptools]
packages = ["rag_subsystem", "rag_subsystem.vector_store", "rag_subsystem.utils"]
include-package-data = true

[tool.setuptools.package-dir]
rag_subsystem = "."

[tool.setuptools.package-data]
rag_subsystem = []
