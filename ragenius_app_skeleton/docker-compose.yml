# Legacy app-skeleton-only stack. Prefer the repository-root compose.yml plus
# the tracked PowerShell startup scripts for integrated development.
version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragenius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragenius}
      POSTGRES_DB: ${POSTGRES_DB:-ragenius}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ragenius} -d ${POSTGRES_DB:-ragenius}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
      - ../:/workspace_root
    command: sh -c "pip install -r backend/requirements.txt && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-ragenius}:${POSTGRES_PASSWORD:-ragenius}@db:5432/${POSTGRES_DB:-ragenius}}
      PYTHONPATH: /app:/workspace_root
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    image: node:20-slim
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:

